version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  # Hash-pinned CI locks: Dependabot bumps the .in files; regenerate the
  # matching .txt with scripts/lock-requirements.sh in the same PR.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
