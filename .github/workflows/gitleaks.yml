name: Gitleaks

# Secret scanning (no account/token): full working-tree scan on every PR and
# push, plus a weekly schedule. Findings fail the job (`--exit-code 1`) and
# upload as SARIF to code scanning under the `gitleaks` category.
# Native CLI in a digest-pinned container — `--redact` keeps findings out of logs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly full scan, Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    container:
      image: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # scan the full tree, not a shallow slice
          persist-credentials: false

      - name: Gitleaks scan
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gitleaks detect --source . --report-format sarif --report-path=gitleaks.sarif --exit-code 1 --redact

      - name: Upload SARIF
        if: always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
