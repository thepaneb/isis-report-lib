name: Scorecard supply-chain security

# OpenSSF Scorecard: weekly plus on-push assessment. Results publish to the
# OpenSSF API (badge + viewer) and to code scanning. Tokenless: read-only
# GITHUB_TOKEN is enough for public repos.
on:
  branch_protection_rule:
  schedule:
    - cron: "30 2 * * 1" # Mondays 02:30 UTC
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload SARIF to code scanning
      id-token: write # to publish to the OpenSSF API (keyless)
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # v2.6.0's ghcr image index points to manifests that return 404, so the
      # runner cannot pull it (Docker pull failed). v2.5.0 is the newest tag
      # whose image is intact; revisit once the registry is fixed upstream.
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
