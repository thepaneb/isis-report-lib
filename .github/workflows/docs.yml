name: Docs

# MkDocs/Zensical site from docs/ (+ landing index). Build validates every
# PR touching docs; deploy runs only on push to main via OIDC (no token).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "docs/requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "docs/requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install docs builder
        run: pip install --require-hashes -r docs/requirements-docs.txt

      - name: Build site (strict)
        run: python -m zensical build --strict

  docs-deploy:
    needs: [docs-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # upload + publish the site
      id-token: write # OIDC for Pages (no stored token)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install docs builder
        run: pip install --require-hashes -r docs/requirements-docs.txt

      - name: Build site (strict)
        run: python -m zensical build --strict --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
