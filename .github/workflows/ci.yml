name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy src

      - name: Format
        run: python -m ruff format --check src tests

      - name: Unit tests (no browser)
        run: python -m pytest tests -q -m "not browser"

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # codecov OIDC upload (no stored token)
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --desc

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        # Ubuntu mirrors flake (503s); retry instead of failing the whole run.
        run: |
          for attempt in 1 2 3 4; do
            python -m playwright install --with-deps chromium && break
            echo "Chromium install failed (attempt $attempt), retrying in 30s..."
            sleep 30
          done
          python -m playwright install chromium

      - name: Full tests with coverage (incl. browser)
        run: timeout 600 python -m pytest tests -q --cov=isis_report_lib --cov-report=term-missing --cov-report=xml

      - name: Perf budgets
        run: timeout 300 python bench/bench.py --check

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload coverage to Codecov
        # OIDC trusted upload (no stored CODECOV_TOKEN). Non-blocking: a
        # Codecov outage must not fail the gate; the 85% bar is already enforced.
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          use_oidc: true
          verbose: true

  gate:
    # Single stable check for branch protection (matrix jobs have suffixed names).
    runs-on: ubuntu-latest
    needs: [lint-unit, e2e]
    steps:
      - run: echo "All required checks passed."
