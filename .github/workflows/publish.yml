name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == true
    permissions:
      id-token: write # OIDC for Trusted Publishing (also register on test.pypi.org)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs precisa das tags
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Check artifacts
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease != true
    permissions:
      id-token: write # OIDC for Trusted Publishing (no token in .env)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs precisa das tags
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Check artifacts
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
