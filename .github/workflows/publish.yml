name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == true
    permissions:
      contents: write # attach sbom.json to the GitHub Release
      id-token: write # OIDC for Trusted Publishing (also register on test.pypi.org)
      attestations: write # Sigstore attestations for the release artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # hatch-vcs precisa das tags
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Build
        run: |
          pip install --require-hashes -r .github/requirements/requirements-publish.txt
          python -m build

      - name: Check artifacts
        run: twine check dist/*

      - name: Generate SBOM (CycloneDX)
        # Isolated env with the release wheel's runtime deps from the hash-pinned
        # lock: the SBOM describes exactly what ships, reproducibly.
        run: |
          python -m venv /tmp/sbom-env
          /tmp/sbom-env/bin/python -m pip install --require-hashes -r .github/requirements/requirements-sbom.txt
          /tmp/sbom-env/bin/python -m pip install --no-deps dist/*.whl
          /tmp/sbom-env/bin/cyclonedx-py environment --of JSON --output-reproducible --sv 1.6 --validate -o sbom.json
          test -s sbom.json

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release upload "$REF_NAME" sbom.json --clobber

      - name: Attest build provenance
        # SLSA provenance for the release artifacts (verifiable with
        # `gh attestation verify dist/* --repo github.com/thepaneb/isis-report-lib`).
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Attest SBOM
        # The generated CycloneDX document has no metadata.component, which
        # `sbom-path` mode requires to name the subject. Attest the SBOM file
        # itself instead (digest-bound provenance covers it too).
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "sbom.json"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease != true
    permissions:
      contents: write # attach sbom.json to the GitHub Release
      id-token: write # OIDC for Trusted Publishing (no token in .env)
      attestations: write # Sigstore attestations for the release artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # hatch-vcs precisa das tags
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Build
        run: |
          pip install --require-hashes -r .github/requirements/requirements-publish.txt
          python -m build

      - name: Check artifacts
        run: twine check dist/*

      - name: Generate SBOM (CycloneDX)
        # Isolated env with the release wheel's runtime deps from the hash-pinned
        # lock: the SBOM describes exactly what ships, reproducibly.
        run: |
          python -m venv /tmp/sbom-env
          /tmp/sbom-env/bin/python -m pip install --require-hashes -r .github/requirements/requirements-sbom.txt
          /tmp/sbom-env/bin/python -m pip install --no-deps dist/*.whl
          /tmp/sbom-env/bin/cyclonedx-py environment --of JSON --output-reproducible --sv 1.6 --validate -o sbom.json
          test -s sbom.json

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release upload "$REF_NAME" sbom.json --clobber

      - name: Attest build provenance
        # SLSA provenance for the release artifacts (verifiable with
        # `gh attestation verify dist/* --repo github.com/thepaneb/isis-report-lib`).
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Attest SBOM
        # The generated CycloneDX document has no metadata.component, which
        # `sbom-path` mode requires to name the subject. Attest the SBOM file
        # itself instead (digest-bound provenance covers it too).
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "sbom.json"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
