name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == true
    permissions:
      contents: write # attach sbom.json to the GitHub Release
      id-token: write # OIDC for Trusted Publishing (also register on test.pypi.org)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # hatch-vcs precisa das tags
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Check artifacts
        run: |
          pip install twine
          twine check dist/*

      - name: Generate SBOM (CycloneDX)
        # Isolated env with only the release wheel: the SBOM describes exactly
        # what ships (package + runtime deps), reproducibly.
        run: |
          python -m venv /tmp/sbom-env
          /tmp/sbom-env/bin/python -m pip install "cyclonedx-bom==9.0.0" dist/*.whl
          /tmp/sbom-env/bin/cyclonedx-py environment --of JSON --output-reproducible --sv 1.6 --validate -o sbom.json
          test -s sbom.json

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release upload "$REF_NAME" sbom.json --clobber

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease != true
    permissions:
      contents: write # attach sbom.json to the GitHub Release
      id-token: write # OIDC for Trusted Publishing (no token in .env)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # hatch-vcs precisa das tags
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Check artifacts
        run: |
          pip install twine
          twine check dist/*

      - name: Generate SBOM (CycloneDX)
        # Isolated env with only the release wheel: the SBOM describes exactly
        # what ships (package + runtime deps), reproducibly.
        run: |
          python -m venv /tmp/sbom-env
          /tmp/sbom-env/bin/python -m pip install "cyclonedx-bom==9.0.0" dist/*.whl
          /tmp/sbom-env/bin/cyclonedx-py environment --of JSON --output-reproducible --sv 1.6 --validate -o sbom.json
          test -s sbom.json

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release upload "$REF_NAME" sbom.json --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
