[project]
name = "isis-report-lib"
dynamic = ["version"]
description = "Python library for tabular PDF reports with customizable hierarchical layouts (Jinja2 + Playwright)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gil Cleber Barboza" }]
keywords = ["pdf", "report", "jinja2", "playwright", "toon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1.6",
    "playwright>=1.65.0",
    "pydantic>=2.0",
    "babel>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1.post1", "pytest-cov>=7.1.0", "pytest-timeout>=2", "ruff>=0.17.4", "openpyxl>=3.1", "mypy>=1.18", "types-openpyxl>=3.1", "pandas>=2.0", "css-inline>=0.20", "cryptography>=42"]
xlsx = ["openpyxl>=3.1"]
pandas = ["pandas>=2.0"]
email = ["css-inline>=0.20"]
sign = ["cryptography>=42"]

[project.scripts]
isis-report = "isis_report_lib.cli:main"

[project.urls]
Homepage = "https://github.com/thepaneb/isis-report-lib"
Source = "https://github.com/thepaneb/isis-report-lib"
Issues = "https://github.com/thepaneb/isis-report-lib/issues"
Changelog = "https://github.com/thepaneb/isis-report-lib/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Layout src/ auto-detectado pelo hatchling (não declarar `packages` manualmente:
# isso gerava wheel vazio). Templates .jinja viajam junto por estarem no pacote.

[tool.hatch.version]
source = "vcs"

[tool.coverage.run]
source = ["isis_report_lib"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Um único loop para todos os testes async: o pool do Playwright é preso ao loop,
# então trocar de loop entre testes causa close cross-loop (trava no Linux).
asyncio_default_test_loop_scope = "session"
markers = ["browser: requires Chromium from Playwright to be installed"]
# Diagnóstico de hangs no CI: despeja stacks aos 90s e falha o teste aos 300s.
faulthandler_timeout = 90
timeout = 300

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["playwright.*", "pandas.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
