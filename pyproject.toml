[project]
name = "isis-report-lib"
dynamic = ["version"]
description = "Biblioteca Python para geração de relatórios PDF tabulares com layouts hierárquicos (Jinja2 + Playwright). Extraída do POC isis_report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gil Cleber Barboza" }]
keywords = ["pdf", "report", "jinja2", "playwright", "toon"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "jinja2>=3.1",
    "playwright>=1.40",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2", "ruff>=0.4"]

[project.scripts]
isis-report = "isis_report_lib.cli:main"

[project.urls]
Homepage = "https://github.com/thepaneb/isis_report"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Layout src/ auto-detectado pelo hatchling (não declarar `packages` manualmente:
# isso gerava wheel vazio). Templates .jinja viajam junto por estarem no pacote.

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Um único loop para todos os testes async: o pool do Playwright é preso ao loop,
# então trocar de loop entre testes causa close cross-loop (trava no Linux).
asyncio_default_test_loop_scope = "session"
markers = ["browser: requer Chromium do Playwright instalado"]
# Diagnóstico de hangs no CI: despeja stacks aos 90s e falha o teste aos 300s.
faulthandler_timeout = 90
timeout = 300

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
