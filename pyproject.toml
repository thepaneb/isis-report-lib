[project]
name = "isis-report-lib"
version = "0.1.0"
description = "Biblioteca Python para geração de relatórios PDF tabulares com layouts hierárquicos (Jinja2 + Playwright). Extraída do POC isis_report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gil Cleber Barboza" }]
keywords = ["pdf", "report", "jinja2", "playwright", "toon"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "jinja2>=3.1",
    "playwright>=1.40",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/thepaneb/isis_report"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isis_report_lib"]

[tool.hatch.build.targets.sdist]
packages = ["src/isis_report_lib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["browser: requer Chromium do Playwright instalado"]
# Diagnóstico de hangs no CI: despeja stacks aos 90s e falha o teste aos 300s.
faulthandler_timeout = 90
timeout = 300

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
